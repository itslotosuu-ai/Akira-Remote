name: Build ChatGPT Watch for Wear OS

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'watch-chatgpt/**'
      - '.github/workflows/build-watch-chatgpt.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Wear OS APK
        run: gradle -p watch-chatgpt :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Watch-WearOS
          path: watch-chatgpt/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chatgpt-watch-latest
          name: ChatGPT Watch for Wear OS — latest
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: watch-chatgpt/app/build/outputs/apk/debug/app-debug.apk
