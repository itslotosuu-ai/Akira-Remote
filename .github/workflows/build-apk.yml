              if marker not in s:
                  raise SystemExit("Could not find setContentView(layout) in MainActivity")
              s = s.replace(marker, panel + "\n" + marker, 1)
              p.write_text(s)
          PY

      - name: Add HUD, touchpad shortcuts, telemetry and system log
        run: |
          python3 - <<'PY'
          from pathlib import Path
          watch = Path("source/AKIRA_REMOTE/watch/src/main/java/com/akira/remotewatch/WatchActivity.java")
          s = watch.read_text()
          s = s.replace("import android.os.Bundle;", "import android.os.Bundle;" + chr(10) + "import android.os.Handler;" + chr(10) + "import android.os.Looper;")
          field = "    private final AtomicReference<android.graphics.Bitmap> latest = new AtomicReference<>();"
          additions = """    private final AtomicReference<android.graphics.Bitmap> latest = new AtomicReference<>();
              private TextView hud, log;
              private final Handler uiHandler = new Handler(Looper.getMainLooper());
              private long pingStartedAt, lastRtt = -1, fpsWindowStart = System.currentTimeMillis();
              private int frameCounter, currentFps;
              private String phoneBattery = "--", phoneTemp = "--", frameSize = "--";
              private final Runnable pingTask = new Runnable() {
                  @Override public void run() {
                      if (client != null && client.isOpen()) {
                          try {
                              pingStartedAt = System.currentTimeMillis();
                              JSONObject ping = new JSONObject();
                              ping.put("type", "ping");
                              client.send(ping.toString());
                          } catch (Exception ignored) {}
                          uiHandler.postDelayed(this, 2500);
                      }
                  }
              };"""
          if "private TextView hud, log;" not in s:
              if field not in s: raise SystemExit("watch field insertion anchor missing")
              s = s.replace(field, additions, 1)
          anchor = '        root.addView(status, new LinearLayout.LayoutParams(-1, 24));'
          hud = '''        hud = new TextView(this);
                  hud.setText("HUD:// WAITING FOR TELEMETRY");
                  hud.setTextColor(0xFFB8FFD0);
                  hud.setTextSize(9);
                  hud.setGravity(Gravity.CENTER);
                  hud.setTypeface(android.graphics.Typeface.MONOSPACE, android.graphics.Typeface.BOLD);
                  hud.setBackgroundColor(0xFF07130C);
                  root.addView(hud, new LinearLayout.LayoutParams(-1, 25));'''
          if 'HUD:// WAITING FOR TELEMETRY' not in s:
              if anchor not in s: raise SystemExit("HUD insertion anchor missing")
              s = s.replace(anchor, anchor + chr(10) + hud, 1)
          quick = '''        LinearLayout quick = new LinearLayout(this);
                  quick.setOrientation(LinearLayout.HORIZONTAL);
                  quick.setGravity(Gravity.CENTER);
                  String[] quickLabels = {"< BACK", "^ HOME", "STOP", "RELINK"};
                  String[] quickTypes = {"back", "home", "stop", "relink"};
                  for (int q = 0; q < quickLabels.length; q++) {
                      final String action = quickTypes[q];
                      Button command = new Button(this);
                      command.setText(quickLabels[q]);
                      command.setTextSize(9);
                      command.setTextColor(0xFF39FF88);
                      command.setTypeface(android.graphics.Typeface.MONOSPACE, android.graphics.Typeface.BOLD);
                      command.setBackgroundTintList(android.content.res.ColorStateList.valueOf(0xFF10251A));
                      LinearLayout.LayoutParams cp = new LinearLayout.LayoutParams(0, 34, 1f);
                      cp.setMargins(2, 2, 2, 2);
                      quick.addView(command, cp);
                      command.setOnClickListener(v -> {
                          if ("relink".equals(action)) connect();
                          else sendCommand(action);
                      });
                  }
                  root.addView(quick, new LinearLayout.LayoutParams(-1, 36));
                  log = new TextView(this);
                  log.setText("LOG:// SYSTEM INITIALIZED");
                  log.setTextColor(0xFF168A50);
                  log.setTextSize(8);
                  log.setTypeface(android.graphics.Typeface.MONOSPACE);
                  log.setMaxLines(2);
                  root.addView(log, new LinearLayout.LayoutParams(-1, 28));'''
          if 'LOG:// SYSTEM INITIALIZED' not in s:
              s = s.replace('        setContentView(root);', quick + chr(10) + '        setContentView(root);', 1)
          old_open = '                @Override public void onOpen(ServerHandshake h) { runOnUiThread(() -> status.setText("LINK ESTABLISHED // RX")); }'
          new_open = '''                @Override public void onOpen(ServerHandshake h) {
                              runOnUiThread(() -> { status.setText("LINK ESTABLISHED // RX"); appendLog("LINK ESTABLISHED"); updateHud(); });
                              uiHandler.removeCallbacks(pingTask);
                              uiHandler.post(pingTask);
                          }'''
          if old_open in s: s = s.replace(old_open, new_open, 1)
          old_msg = '                @Override public void onMessage(String m) {}'
          new_msg = '''                @Override public void onMessage(String m) {
                              try {
                                  JSONObject reply = new JSONObject(m);
                                  if ("pong".equals(reply.optString("type"))) {
                                      lastRtt = System.currentTimeMillis() - pingStartedAt;
                                      phoneBattery = reply.optString("battery", "--");
                                      phoneTemp = reply.optString("temp", "--");
                                      runOnUiThread(() -> updateHud());
                                  }
                              } catch (Exception ignored) {}
                          }'''
          if old_msg in s: s = s.replace(old_msg, new_msg, 1)
          old_frame = '                    if (bmp != null) runOnUiThread(() -> screen.setImageBitmap(bmp));'
          new_frame = '''                    if (bmp != null) runOnUiThread(() -> {
                                  screen.setImageBitmap(bmp);
                                  frameSize = bmp.getWidth() + "x" + bmp.getHeight();
                                  frameCounter++;
                                  long now = System.currentTimeMillis();
                                  if (now - fpsWindowStart >= 1000) {
                                      currentFps = frameCounter;
                                      frameCounter = 0;
                                      fpsWindowStart = now;
                                  }
                                  updateHud();
                              });'''
          if old_frame in s: s = s.replace(old_frame, new_frame, 1)
          old_close = '                @Override public void onClose(int c, String r, boolean remote) { runOnUiThread(() -> status.setText("LINK LOST // IDLE")); }'
          new_close = '''                @Override public void onClose(int c, String r, boolean remote) {
                              uiHandler.removeCallbacks(pingTask);
                              runOnUiThread(() -> { status.setText("LINK LOST // IDLE"); appendLog("LINK CLOSED"); });
                          }'''
          if old_close in s: s = s.replace(old_close, new_close, 1)
          old_error = '                @Override public void onError(Exception e) { runOnUiThread(() -> status.setText("ERR:// CONNECTION FAILED")); }'
          new_error = '''                @Override public void onError(Exception e) {
                              runOnUiThread(() -> { status.setText("ERR:// CONNECTION FAILED"); appendLog("ERR: SOCKET"); });
                          }'''
          if old_error in s: s = s.replace(old_error, new_error, 1)
          if 'private void sendCommand(String type)' not in s:
              methods = '''    private void sendCommand(String type) {
                  if (client == null || !client.isOpen()) { appendLog("COMMAND BLOCKED: OFFLINE"); return; }
                  try {
                      JSONObject command = new JSONObject();
                      command.put("type", type);
                      client.send(command.toString());
                      appendLog("CMD // " + type.toUpperCase());
                  } catch (Exception ignored) {}
              }
              private void appendLog(String event) {
                  if (log == null) return;
                  String old = log.getText().toString();
                  String[] lines = (old + "\\n> " + event).split("\\n");
                  StringBuilder recent = new StringBuilder();
                  for (int i = Math.max(0, lines.length - 2); i < lines.length; i++) {
                      if (recent.length() > 0) recent.append("\\n");
                      recent.append(lines[i]);
                  }
                  log.setText(recent.toString());
              }
              private void updateHud() {
                  if (hud == null) return;
                  String rtt = lastRtt < 0 ? "--" : lastRtt + "ms";
                  hud.setText("FPS " + currentFps + " • RTT " + rtt + " • BAT " + phoneBattery
                      + " • TEMP " + phoneTemp + " • " + frameSize);
              }
          '''
              s = s.replace('    @Override protected void onDestroy() {', methods + '    @Override protected void onDestroy() {', 1)
          s = s.replace('''    @Override protected void onDestroy() {
                  if (client != null) client.close();''', '''    @Override protected void onDestroy() {
                  uiHandler.removeCallbacks(pingTask);
                  if (client != null) client.close();''', 1)
          watch.write_text(s)
          # Apply telemetry additions after all prior UI patches have completed.
          w = watch.read_text()
          w = w.replace('private String phoneBattery = "--", phoneTemp = "--", frameSize = "--";',
              'private String phoneBattery = "--", phoneTemp = "--", phoneNetwork = "--", frameSize = "--";')
          w = w.replace('phoneTemp = reply.optString("temp", "--");',
              'phoneTemp = reply.optString("temp", "--");' + chr(10) + '                            phoneNetwork = reply.optString("network", "--");')
          w = w.replace('" • TEMP " + phoneTemp + " • " + frameSize',
              '" • TEMP " + phoneTemp + " • NET " + phoneNetwork + " • " + frameSize')
          w = w.replace('        if (screen.getDrawable() == null) return null;',
              '''        if (screen.getScaleType() == ImageView.ScaleType.FIT_XY) {
                      return new float[]{clamp(viewX / Math.max(1f, screen.getWidth())),
                          clamp(viewY / Math.max(1f, screen.getHeight()))};
                  }
                  if (screen.getDrawable() == null) return null;''', 1)
          watch.write_text(w)

          service = Path("source/AKIRA_REMOTE/phone/src/main/java/com/akira/remote/ControlAccessibilityService.java")
          a = service.read_text()
          if "public void goBack()" not in a:
              a = a.replace("    public void tap(", "    public void goBack() { performGlobalAction(GLOBAL_ACTION_BACK); }" + chr(10) + "    public void goHome() { performGlobalAction(GLOBAL_ACTION_HOME); }" + chr(10) + "    public void tap(", 1)
          service.write_text(a)

          capture = Path("source/AKIRA_REMOTE/phone/src/main/java/com/akira/remote/CaptureService.java")
          c = capture.read_text()
          if "import android.net.ConnectivityManager;" not in c:
              c = c.replace("import android.os.BatteryManager;", "import android.os.BatteryManager;" + chr(10) + "import android.net.ConnectivityManager;" + chr(10) + "import android.net.Network;" + chr(10) + "import android.net.NetworkCapabilities;", 1)
          c = c.replace('''                                  pong.put("temp", temp < 0 ? "--" : String.format(java.util.Locale.US, "%.1fC", temp / 10f));
                                  conn.send(pong.toString());''',
              '''                                  pong.put("temp", temp < 0 ? "--" : String.format(java.util.Locale.US, "%.1fC", temp / 10f));
                                  ConnectivityManager cm = getSystemService(ConnectivityManager.class);
                                  Network active = cm == null ? null : cm.getActiveNetwork();
                                  NetworkCapabilities caps = (cm == null || active == null) ? null : cm.getNetworkCapabilities(active);
                                  String net = caps == null ? "OFFLINE" : (caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) ? "WIFI" : "ONLINE");
                                  pong.put("network", net);
                                  conn.send(pong.toString());''', 1)
          if "BatteryManager" not in c:
              c = c.replace("import android.app.*;", "import android.app.*;" + chr(10) + "import android.content.IntentFilter;" + chr(10) + "import android.os.BatteryManager;", 1)
          old_commands = """                ControlAccessibilityService a = ControlAccessibilityService.INSTANCE;
                          if (a == null) return;
                          String type = j.optString("type");
                          if ("tap".equals(type)) a.tap((float)j.optDouble("x"), (float)j.optDouble("y"));
                          else if ("swipe".equals(type)) a.swipe((float)j.optDouble("x1"), (float)j.optDouble("y1"),
                              (float)j.optDouble("x2"), (float)j.optDouble("y2"), j.optLong("duration", 300));"""
          new_commands = """                ControlAccessibilityService a = ControlAccessibilityService.INSTANCE;
                          String type = j.optString("type");
                          if ("ping".equals(type)) {
                              try {
                                  Intent battery = registerReceiver(null, new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
                                  int level = battery == null ? -1 : battery.getIntExtra(BatteryManager.EXTRA_LEVEL, -1);
                                  int scale = battery == null ? 100 : battery.getIntExtra(BatteryManager.EXTRA_SCALE, 100);
                                  int temp = battery == null ? -1 : battery.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, -1);
                                  JSONObject pong = new JSONObject();
                                  pong.put("type", "pong");
                                  pong.put("battery", level < 0 ? "--" : Math.round(level * 100f / Math.max(1, scale)) + "%");
                                  pong.put("temp", temp < 0 ? "--" : String.format(java.util.Locale.US, "%.1fC", temp / 10f));
                                  conn.send(pong.toString());
                              } catch (Exception ignored) {}
                              return;
                          }
                          if ("stop".equals(type)) { CaptureService.this.stopSelf(); return; }
                          if (a == null) return;
                          if ("tap".equals(type)) a.tap((float)j.optDouble("x"), (float)j.optDouble("y"));
                          else if ("back".equals(type)) a.goBack();
                          else if ("home".equals(type)) a.goHome();
                          else if ("swipe".equals(type)) a.swipe((float)j.optDouble("x1"), (float)j.optDouble("y1"),
                              (float)j.optDouble("x2"), (float)j.optDouble("y2"), j.optLong("duration", 300));"""
          if "if (\"ping\".equals(type))" not in c:
              if old_commands not in c: raise SystemExit("phone command handler anchor missing")
              c = c.replace(old_commands, new_commands, 1)
          capture.write_text(c)
          # Report active network transport alongside battery telemetry.
          c = capture.read_text()
          if "import android.net.ConnectivityManager;" not in c:
              c = c.replace("import android.os.BatteryManager;", "import android.os.BatteryManager;" + chr(10) + "import android.net.ConnectivityManager;" + chr(10) + "import android.net.Network;" + chr(10) + "import android.net.NetworkCapabilities;", 1)
          c = c.replace('''                                  pong.put("temp", temp < 0 ? "--" : String.format(java.util.Locale.US, "%.1fC", temp / 10f));
                                  conn.send(pong.toString());''',
              '''                                  pong.put("temp", temp < 0 ? "--" : String.format(java.util.Locale.US, "%.1fC", temp / 10f));
                                  ConnectivityManager cm = getSystemService(ConnectivityManager.class);
                                  Network active = cm == null ? null : cm.getActiveNetwork();
                                  NetworkCapabilities caps = (cm == null || active == null) ? null : cm.getNetworkCapabilities(active);
                                  String net = caps == null ? "OFFLINE" : (caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) ? "WIFI" : "ONLINE");
                                  pong.put("network", net);
                                  conn.send(pong.toString());''', 1)
          capture.write_text(c)
          PY

      - name: Upload patched source for inspection
        uses: actions/upload-artifact@v4
        with:
          name: AKIRA-REMOTE-source
          path: source/AKIRA_REMOTE
          retention-days: 1

      - name: Build APKs
        run: |
          cd source/AKIRA_REMOTE
          gradle assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AKIRA-REMOTE-APKs
          path: |
            source/AKIRA_REMOTE/phone/build/outputs/apk/debug/*.apk
            source/AKIRA_REMOTE/watch/build/outputs/apk/debug/*.apk
