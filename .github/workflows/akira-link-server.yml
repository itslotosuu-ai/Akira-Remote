name: SYNKRON LINK Server

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/akira-link-server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/akira-link-server.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run relay integration tests
        run: npm test
      - name: Build container
        run: docker build -t synkron-link-relay:test .
