name: Build SYNKRON Desktop

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows installers
        working-directory: desktop
        run: npm run dist

      - name: Publish direct Windows downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: SYNKRON Desktop — latest
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            desktop/dist/*.exe

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: SYNKRON-Windows
          path: |
            desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
